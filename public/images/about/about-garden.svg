<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
  <title id="title">Coconut farm and supply illustration</title>
  <desc id="desc">A calm coconut plantation landscape with fresh coconuts, designed as a background for an informative About page hero.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FBEF"/>
      <stop offset="0.58" stop-color="#E9F3D8"/>
      <stop offset="1" stop-color="#CFE4AC"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9D98B"/>
      <stop offset="1" stop-color="#7EAD5D"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#50341D"/>
      <stop offset="0.48" stop-color="#795130"/>
      <stop offset="1" stop-color="#3B2818"/>
    </linearGradient>
    <radialGradient id="coconutGreen" cx="32%" cy="24%" r="78%">
      <stop offset="0" stop-color="#B8E66F"/>
      <stop offset="0.45" stop-color="#64AC42"/>
      <stop offset="1" stop-color="#27652F"/>
    </radialGradient>
    <radialGradient id="coconutBrown" cx="30%" cy="23%" r="82%">
      <stop offset="0" stop-color="#B1814D"/>
      <stop offset="0.55" stop-color="#76502E"/>
      <stop offset="1" stop-color="#3B2414"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF8D7" stop-opacity="0.95"/>
      <stop offset="0.42" stop-color="#F4E6A8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F4E6A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FBEF" stop-opacity="0.98"/>
      <stop offset="0.55" stop-color="#F8FBEF" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#F8FBEF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#18351C" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="sceneClip"><rect width="1200" height="640" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#sceneClip)">
    <rect width="1200" height="640" fill="url(#bg)"/>
    <circle cx="835" cy="118" r="220" fill="url(#sunGlow)"/>

    <!-- soft botanical texture -->
    <g opacity="0.18" fill="none" stroke="#557E42" stroke-width="2">
      <path d="M80 120C190 70 285 85 376 40"/>
      <path d="M74 138C160 118 245 132 330 95"/>
      <path d="M520 86C610 42 704 51 792 15"/>
    </g>

    <!-- distant plantation -->
    <path d="M0 430C170 385 326 414 474 378C650 336 836 355 1200 294V640H0Z" fill="#B8D690" opacity="0.72"/>
    <path d="M0 486C238 433 426 467 612 417C795 368 1000 390 1200 350V640H0Z" fill="url(#field)"/>
    <path d="M0 548C260 515 460 540 654 496C850 451 1013 471 1200 430V640H0Z" fill="#6F9E52" opacity="0.78"/>

    <!-- subtle farm rows -->
    <g fill="none" stroke="#DCEBC7" stroke-width="5" stroke-linecap="round" opacity="0.36">
      <path d="M480 640C585 551 700 506 855 462"/>
      <path d="M620 640C690 560 790 510 930 471"/>
      <path d="M760 640C820 572 920 526 1044 497"/>
    </g>

    <!-- right palm -->
    <g transform="translate(920 58)">
      <path d="M104 598C113 484 101 383 111 246" fill="none" stroke="url(#trunk)" stroke-width="24" stroke-linecap="round"/>
      <g fill="#2D6C34">
        <path d="M112 255C53 311 7 323-47 308C14 254 57 237 112 255Z"/>
        <path d="M112 255C42 239-4 205-37 157C35 169 82 197 112 255Z"/>
        <path d="M112 255C72 190 73 133 91 77C130 139 135 196 112 255Z"/>
        <path d="M112 255C148 187 201 158 260 151C218 213 171 245 112 255Z"/>
        <path d="M112 255C181 239 234 257 277 293C204 303 156 289 112 255Z"/>
        <path d="M112 255C174 286 203 327 207 382C151 348 120 307 112 255Z"/>
      </g>
      <g fill="#3F8240" opacity="0.8">
        <path d="M112 255C63 278 29 284-20 277C26 248 65 239 112 255Z"/>
        <path d="M112 255C94 201 101 159 116 121C139 177 134 219 112 255Z"/>
      </g>
      <g fill="url(#coconutGreen)">
        <circle cx="96" cy="274" r="24"/>
        <circle cx="127" cy="272" r="25"/>
        <circle cx="114" cy="297" r="23"/>
      </g>
    </g>

    <!-- left cropped palm for visual frame -->
    <g transform="translate(-42 112) scale(.72)" opacity="0.72">
      <path d="M142 630C153 500 137 397 151 260" fill="none" stroke="url(#trunk)" stroke-width="25" stroke-linecap="round"/>
      <g fill="#34713A">
        <path d="M151 265C89 314 26 320-36 300C33 249 91 238 151 265Z"/>
        <path d="M151 265C83 240 35 199 3 145C77 162 122 202 151 265Z"/>
        <path d="M151 265C118 199 126 138 151 85C181 151 180 210 151 265Z"/>
        <path d="M151 265C192 203 246 177 305 176C258 229 209 257 151 265Z"/>
      </g>
    </g>

    <!-- foreground coconut cluster -->
    <g transform="translate(778 421)">
      <ellipse cx="154" cy="156" rx="172" ry="35" fill="#234B27" opacity="0.22" filter="url(#softShadow)"/>
      <path d="M-30 144C22 95 64 73 118 49" fill="none" stroke="#3D783C" stroke-width="16" stroke-linecap="round"/>
      <path d="M42 104C17 61 15 20 29-18C65 22 72 63 42 104Z" fill="#3E823F"/>
      <path d="M71 86C71 37 88 4 116-25C133 28 117 65 71 86Z" fill="#34753A"/>
      <path d="M96 94C121 47 151 25 190 13C182 65 149 93 96 94Z" fill="#2D6B35"/>

      <g transform="rotate(-8 90 105)">
        <ellipse cx="84" cy="106" rx="73" ry="82" fill="url(#coconutGreen)"/>
        <path d="M34 88C65 63 103 55 138 65" fill="none" stroke="#C9EE8E" stroke-width="9" stroke-linecap="round" opacity="0.26"/>
        <path d="M60 37C84 20 111 22 130 37" fill="none" stroke="#EAF8C7" stroke-width="8" stroke-linecap="round" opacity="0.28"/>
      </g>
      <g transform="translate(100 18) rotate(9 86 106)">
        <ellipse cx="86" cy="106" rx="76" ry="86" fill="url(#coconutGreen)"/>
        <path d="M33 86C69 61 111 56 144 68" fill="none" stroke="#D5F29B" stroke-width="10" stroke-linecap="round" opacity="0.24"/>
      </g>
      <g transform="translate(78 76)">
        <ellipse cx="74" cy="76" rx="65" ry="70" fill="url(#coconutBrown)"/>
        <path d="M31 69C58 47 89 45 116 56" fill="none" stroke="#D2A875" stroke-width="8" stroke-linecap="round" opacity="0.2"/>
        <circle cx="56" cy="52" r="5" fill="#2A190F"/>
        <circle cx="76" cy="47" r="5" fill="#2A190F"/>
        <circle cx="67" cy="64" r="5" fill="#2A190F"/>
      </g>
    </g>

    <!-- informational decorative motif: source-to-supply path -->
    <g transform="translate(642 466)" opacity="0.7">
      <path d="M0 56C62 24 119 18 182 28" fill="none" stroke="#F5F9EC" stroke-width="3" stroke-dasharray="8 10" stroke-linecap="round"/>
      <circle cx="0" cy="56" r="7" fill="#F5F9EC"/>
      <circle cx="182" cy="28" r="7" fill="#F5F9EC"/>
    </g>

    <!-- text-safe veil: keeps heading readable on the left -->
    <rect x="0" y="0" width="760" height="640" fill="url(#fadeLeft)"/>

    <!-- refined border highlights -->
    <path d="M0 0H1200" stroke="#FFFFFF" stroke-opacity="0.55"/>
    <path d="M0 639H1200" stroke="#244B2B" stroke-opacity="0.12"/>
  </g>
</svg>
